name: 攻击面监控

# 定时自动扫描 + 支持手动触发
on:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）
    - cron: '0 2 * * 1'
  workflow_dispatch:

# 最小权限原则：只读代码 + 写 Issue + 上传 Code Scanning 结果
permissions:
  contents: read
  issues: write
  security-events: write

concurrency:
  group: surface-watch-scan
  cancel-in-progress: false

jobs:
  scan:
    name: 扫描并比对基线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 恢复上一次的基线
        uses: actions/cache@v4
        with:
          path: state
          # 每次用新 key，靠 restore-keys 前缀匹配恢复上一次的结果
          key: surface-watch-baseline-${{ github.run_id }}
          restore-keys: |
            surface-watch-baseline-

      - name: 执行扫描（零依赖，无需 npm install）
        run: |
          set +e
          # 同时产出 SARIF，供后续上传到 GitHub Code Scanning
          node src/index.mjs --scope scope.json --out out --update-baseline --sarif
          code=$?
          set -e
          # 退出码 1 表示有新发现达到门禁阈值：这是"有结果"，不是"运行失败"，
          # 因此不中断流程，交由后面的 Issue 步骤负责通知。
          if [ "$code" -eq 1 ]; then
            echo "::notice::发现达到门禁阈值的新增问题"
          elif [ "$code" -ne 0 ]; then
            echo "::error::扫描运行失败（退出码 $code）"
            exit "$code"
          fi

      - name: 写入 Actions 摘要（可直接在页面阅读）
        if: always()
        run: |
          if [ -f out/report.md ]; then
            cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成报告" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-watch-report-${{ github.run_number }}
          # 排除 Webhook 投递记录：它含投递 URL（当前已脱敏为 /前2位*** + urlHash），
          # 但 artifact 是长期可下载的对外产物 —— 凭据类字段一律不进 artifact，
          # 不依赖「脱敏逻辑以后不会退化」这个假设。投递结果仍可在运行日志与摘要中查看。
          path: |
            out/
            !out/webhook-delivery.json
          retention-days: 90

      - name: 上传 SARIF 至 GitHub Code Scanning
        # 让发现直接出现在仓库 Security 面板：可指派、可标记误报、可跟踪修复，
        # 团队不必打开报告才知道出了问题。
        if: always() && hashFiles('out/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/results.sarif
          # 分类名：同一仓库上传多个工具的 SARIF 时用于区分
          category: surface-watch
          # 不因告警而让工作流失败（告警由 Security 面板与 Issue 跟踪）
          wait-for-processing: false

      - name: 有新发现时创建或更新 Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f out/findings.json ]; then
            echo "无扫描数据，跳过通知"
            exit 0
          fi

          # 判据不在这里算：直接读产物里由单一变化源（src/lib/changeset.mjs）算好的 addedCount。
          # 这样"什么算变化"只有一处实现，将来扩展判据不会漏改 CI（原先内联的
          # node -e "...d.diff.added.length" 就是第三份重复实现）。
          NEW=$(node -e "const d=require('./out/findings.json'); const cs=d.changeset; if(!cs||typeof cs.addedCount!=='number'){console.error('findings.json 缺少 changeset.addedCount（产物契约不匹配），拒绝在判据未知时开 Issue');process.exit(1)} process.stdout.write(String(cs.addedCount))")
          echo "新增发现数：$NEW"

          if [ "$NEW" -eq 0 ]; then
            echo "✅ 无新增，保持安静（这正是本工具的设计目标：不制造噪音）"
            exit 0
          fi

          # 确保标签存在（已存在时忽略报错）
          gh label create surface-watch \
            --description "由 surface-watch 自动创建的攻击面变化通知" \
            --color 0e8a16 2>/dev/null || true

          # 正文截断，避免超过 Issue 长度上限
          head -c 60000 out/report.md > /tmp/issue-body.md

          EXISTING=$(gh issue list --label surface-watch --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "向已有 Issue #$EXISTING 追加本次变化"
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh issue create \
              --title "🛡️ 攻击面变化：新增 $NEW 项（$(date -u +%Y-%m-%d)）" \
              --body-file /tmp/issue-body.md \
              --label surface-watch
          fi

          echo "::warning::发现 $NEW 项新增问题，已创建/更新跟踪 Issue"
